url: https://moviedo5.github.io/aemet2fdata/

template:
  bootstrap: 5
  bootswatch: flatly

home:
  title: aemet2fdata
  description: >
    Download meteorological data from AEMET OpenData and convert them
    into functional data objects in R.

navbar:
